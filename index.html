<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My LX Panel</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      display: grid;
      min-height: 100vh;
      place-items: center;
    }
    .panel {
      width: min(85%, 360px);
      padding: 25px;
      background: #1e293b;
      border-radius: 18px;
      text-align: center;
      box-sizing: border-box;
    }
    h1 { color: #38bdf8; }
    p { color: #cbd5e1; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
    }
    button {
      background: #0284c7;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>MY LX PANEL</h1>
    <p>Welcome to your website</p>
    <p>Admin dashboard coming soon</p>
  </main>
</body>
</html>
